# .github/workflows/e2e.yml
# HITL-aware E2E suite for the DevDocs AI web app.
# Complements ci.yml's test-e2e job with HITL secrets, BASE_URL wiring,
# agent-feedback digest, and full artifact upload (video, traces, monitors).
name: E2E (HITL)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify deployed-test configuration
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          E2E_STORAGE_STATE_BASE64: ${{ secrets.E2E_STORAGE_STATE_BASE64 }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          test -n "$BASE_URL"
          test -n "$E2E_STORAGE_STATE_BASE64"
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"

      - name: Restore authenticated browser state
        env:
          E2E_STORAGE_STATE_BASE64: ${{ secrets.E2E_STORAGE_STATE_BASE64 }}
        run: echo "$E2E_STORAGE_STATE_BASE64" | base64 --decode > apps/web/e2e/storage-state/user.json

      - name: Run HITL E2E tests
        run: pnpm --filter @devdocs/web test:e2e:hitl
        env:
          CI: "true"
          SKIP_WEBSERVER: "1"
          WORKERS: "1"
          BASE_URL: ${{ vars.BASE_URL }}
          HITL_WEBHOOK_URL: ${{ secrets.HITL_WEBHOOK_URL }}
          HITL_RESUME_SECRET: ${{ secrets.HITL_RESUME_SECRET }}
          ENABLE_AI_TRIAGE: ${{ vars.ENABLE_AI_TRIAGE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Agent-ready failure digest
        if: always()
        run: pnpm --filter @devdocs/web report:agent || true

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/test-results/agent-feedback.json
          retention-days: 30
